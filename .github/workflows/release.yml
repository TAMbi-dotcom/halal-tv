# Halal TV releases: push a tag such as v0.1.0 and this builds the TV apps, signs them with the fixed
# key in the DEBUG_KEYSTORE secret (the same one as the test builds, so either can update the other)
# and attaches halal-tv-ontv.apk and halal-tv-home.apk to a GitHub Release.
# scripts/install-windows.ps1 downloads halal-tv-ontv.apk from the latest release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Android platform 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then echo "Set the DEBUG_KEYSTORE secret first (Settings, Secrets, Actions)."; exit 1; fi
          printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/ci.keystore"
          echo "COUCHTV_KEYSTORE=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
      - name: Build the TV apps
        run: sh scripts/build-apk.sh
      - name: Name the files
        run: |
          mkdir -p out
          cp dist/couch-tv-ontv.apk out/halal-tv-ontv.apk
          cp dist/couch-tv-home.apk out/halal-tv-home.apk
          cp scripts/install-windows.ps1 out/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Halal TV $TAG" --notes "Install: scripts/install-windows.ps1 (Windows) or on-tv/README.md." --prerelease
          gh release upload "$TAG" out/* --clobber
